name: Deploy AutoM8 website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - website/**
      - .github/workflows/website-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: website

      - name: Build website
        run: npm run build
        working-directory: website
        env:
          VITE_BASE_PATH: /autom8-website/

      - name: Add static route entry points and fallback
        run: |
          for route in \
            plans \
            for-business-leaders \
            docs \
            docs/getting-started \
            docs/account-and-access \
            docs/projects \
            docs/flows \
            docs/screens \
            docs/design-systems \
            docs/preview \
            docs/figma \
            docs/export \
            docs/plans-and-usage \
            docs/troubleshooting
          do
            mkdir -p "website/dist/$route"
            cp website/dist/index.html "website/dist/$route/index.html"
          done
          cp website/dist/index.html website/dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
